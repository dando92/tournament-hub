<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tournament Hub</title>
    <script>
      /*
       * Applies the stored appearance before the first paint. It runs before
       * any module is fetched, so it cannot import the keys and the contrast
       * rule from src/shared/lib/themePreference.ts and accentColor.ts — they
       * are duplicated here and have to be kept in step.
       */
      try {
        var storedTheme = localStorage.getItem("theme_preference");
        if (storedTheme === "light" || storedTheme === "dark") {
          document.documentElement.dataset.theme = storedTheme;
        }

        var storedAccent = localStorage.getItem("accent_color");
        if (/^#[0-9a-fA-F]{6}$/.test(storedAccent || "")) {
          var channels = [1, 3, 5].map(function (index) {
            return parseInt(storedAccent.slice(index, index + 2), 16);
          });
          var luminance = [0.2126, 0.7152, 0.0722].reduce(function (total, weight, index) {
            var value = channels[index] / 255;
            return total + weight * (value <= 0.03928 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4));
          }, 0);
          document.documentElement.style.setProperty("--ui-accent", channels.join(" "));
          document.documentElement.style.setProperty("--ui-accent-contrast", luminance > 0.4 ? "0 0 0" : "255 255 255");
        }
      } catch (error) {
        /* Storage can be unavailable; the operating system preference applies. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
